site_name: Vivek's DevEx Notes
site_description: Field notes on developer experience from 7+ years in DevOps and platform engineering.
site_url: https://vivek-itp.github.io/mydevexblog/
site_author: Vivek K
repo_url: https://github.com/vivek-Itp/mydevexblog
repo_name: vivek-Itp/mydevexblog
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Vivek K

theme:
  name: material
  language: en
  icon:
    logo: material/notebook-edit-outline
    repo: fontawesome/brands/github
  palette:
    # Follows the reader's OS setting, with a manual toggle.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search
  - tags
  - blog:
      blog_dir: blog
      post_url_format: "{date}/{slug}"
      post_date_format: long
      post_excerpt: required
      archive: true
      archive_name: Archive
      categories: true
      categories_allowed:
        - CI/CD
        - Kubernetes
        - Platform Engineering
        - Developer Experience
        - Observability
        - Tooling
      pagination_per_page: 10
      draft: false          # never publish posts marked draft: true
      draft_on_serve: true  # but do show them when running `mkdocs serve` locally
  - rss:
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
      categories:
        - categories
        - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vivek-Itp
      name: GitHub
    - icon: material/rss
      link: https://vivek-itp.github.io/mydevexblog/feed_rss_created.xml
      name: RSS feed

nav:
  - Home: index.md
  - Blog:
      - blog/index.md
  - About: about.md
